services:
  jubileu-db:
    image: postgres:16
    container_name: jubileu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jubileu
      POSTGRES_USER: jubileu_app
      POSTGRES_PASSWORD: jubileu_password
    volumes:
      - jubileu_db_data:/var/lib/postgresql/data
    networks:
      - jubileu_net
    expose:
      - "5432"

  jubileu-api:
    image: python:3.12-slim
    container_name: jubileu-api
    restart: unless-stopped
    working_dir: /app
    command: >
      bash -c "
      pip install -r requirements.txt &&
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    volumes:
      - ./backend/jubileu-api-fastapi:/app
    env_file:
      - ./backend/jubileu-api-fastapi/.env
    depends_on:
      - jubileu-db
    networks:
      - jubileu_net
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: jubileu-nginx
    restart: unless-stopped
    depends_on:
      - jubileu-api
    ports:
      - "80:80"
    volumes:
      - ./frontend/jubileu-web/dist:/usr/share/nginx/html:ro
      - ./infra/nginx/jubileu.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - jubileu_net

networks:
  jubileu_net:
    driver: bridge

volumes:
  jubileu_db_data:
