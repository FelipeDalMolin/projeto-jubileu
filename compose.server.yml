services:
  jubileu-db:
    image: postgres:16
    container_name: jubileu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - jubileu_db_data:/var/lib/postgresql/data
    networks:
      - jubileu_net
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jubileu_app -d jubileu"]
      interval: 10s
      timeout: 5s
      retries: 5

  jubileu-api:
    build:
      context: ./backend/jubileu-api-fastapi
    container_name: jubileu-api
    restart: unless-stopped
    init: true
    working_dir: /app
    command: >
      bash -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    volumes:
      - ./backend/jubileu-api-fastapi:/app
    env_file:
      - .env.server
    depends_on:
      jubileu-db:
        condition: service_healthy
    networks:
      - jubileu_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: jubileu-nginx
    restart: unless-stopped
    depends_on:
      jubileu-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./frontend/jubileu-web/dist:/usr/share/nginx/html:ro
      - ./infra/nginx/jubileu.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - jubileu_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  jubileu_net:
    driver: bridge

volumes:
  jubileu_db_data:
