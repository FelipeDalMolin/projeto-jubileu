name: ${COMPOSE_PROJECT_NAME:-jubileu-rc}

services:
  jubileu-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - jubileu_net
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  migration:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE with digest is required}
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ${RELEASE_ENV_FILE:-.env.release}
    environment:
      # Required by the Collector allowlist whenever a future production
      # canary flips OTEL_SDK_DISABLED=false.
      OTEL_SEMCONV_STABILITY_OPT_IN: ${OTEL_SEMCONV_STABILITY_OPT_IN:-http,database}
    depends_on:
      jubileu-db:
        condition: service_healthy
    networks:
      - jubileu_net
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  jubileu-api:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE with digest is required}
    restart: unless-stopped
    init: true
    env_file:
      - ${RELEASE_ENV_FILE:-.env.release}
    depends_on:
      jubileu-db:
        condition: service_healthy
    networks:
      - jubileu_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')\""]
      interval: 30s
      timeout: 5s
      retries: 20
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  nginx:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE with digest is required}
    restart: unless-stopped
    depends_on:
      jubileu-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NGINX_PORT:?NGINX_PORT is required}:80"
    networks:
      - jubileu_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 20
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  jubileu_net:
    driver: bridge

volumes:
  db_data:
    name: ${POSTGRES_VOLUME_NAME:?POSTGRES_VOLUME_NAME is required}
    external: true
