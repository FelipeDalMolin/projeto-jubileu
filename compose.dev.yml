services:
  postgres-dev:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jubileu_dev}
      POSTGRES_USER: ${POSTGRES_USER:-jubileu_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
    volumes:
      - jubileu_dev_postgres_data:/var/lib/postgresql/data
    networks:
      - jubileu_dev_internal
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-jubileu_dev} -d ${POSTGRES_DB:-jubileu_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/jubileu-api-fastapi
    restart: unless-stopped
    init: true
    working_dir: /app
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jubileu_dev}:${POSTGRES_PASSWORD:-change-me-dev-only}@postgres-dev:5432/${POSTGRES_DB:-jubileu_dev}
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-only}
      AUTH_MODE: ${AUTH_MODE:-jwt_compat}
    volumes:
      - ./backend/jubileu-api-fastapi:/app
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - jubileu_dev_internal
    ports:
      - "127.0.0.1:8000:8000"

  frontend-dev:
    image: node:22-alpine
    restart: unless-stopped
    init: true
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "npm ci && npm run dev -- --host 0.0.0.0 --port 5173",
      ]
    environment:
      E2E_API_URL: http://backend:8000
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    volumes:
      - ./frontend/jubileu-web:/app
      - jubileu_dev_frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - jubileu_dev_internal
    ports:
      - "127.0.0.1:5173:5173"

networks:
  jubileu_dev_internal:
    driver: bridge

volumes:
  jubileu_dev_postgres_data:
  jubileu_dev_frontend_node_modules:
