name: CI

on:
  pull_request:
    branches:
      - jubileu-v2
  push:
    branches:
      - jubileu-v2

jobs:
  docs-sync:
    name: Docs sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check generated code map
        run: python scripts/docs/generate_code_map.py --check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/jubileu-api-fastapi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/jubileu-api-fastapi/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests with coverage
        run: python -m coverage run --branch -m pytest -q -rs

      - name: Report backend coverage
        run: python -m coverage report -m

      - name: Run backend smoke tests
        run: python -m pytest -q -m smoke -rs

      - name: Run backend contract tests
        run: python -m pytest -q -m contract -rs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/jubileu-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/jubileu-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Check frontend API contract
        run: npm run check:api-contract

  playwright-preflight:
    name: Playwright preflight
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend/jubileu-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/jubileu-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Show Playwright version
        run: npx playwright --version

  auth-postgresql:
    name: Auth PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jubileu
          POSTGRES_PASSWORD: jubileu
          POSTGRES_DB: auth_clean
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jubileu -d auth_clean"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend/jubileu-api-fastapi
    env:
      APP_ENV: test
      JWT_SECRET: ci-access-secret-at-least-thirty-two-characters
      REFRESH_TOKEN_HMAC_SECRET: ci-refresh-secret-at-least-thirty-two-characters
      DATABASE_URL_TEST: postgresql+psycopg://jubileu:jubileu@127.0.0.1:5432/auth_clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/jubileu-api-fastapi/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Alembic on clean database
        env:
          DATABASE_URL: postgresql+psycopg://jubileu:jubileu@127.0.0.1:5432/auth_clean
        run: alembic upgrade head
      - name: Alembic upgrade from v0.3 baseline
        env:
          PGPASSWORD: jubileu
          DATABASE_URL: postgresql+psycopg://jubileu:jubileu@127.0.0.1:5432/auth_migrated
        run: |
          createdb -h 127.0.0.1 -U jubileu auth_migrated
          alembic upgrade 0019_proxima_partida_idempotente
          alembic upgrade head
          alembic upgrade head
      - name: Auth PostgreSQL tests without skips
        env:
          DATABASE_URL: postgresql+psycopg://jubileu:jubileu@127.0.0.1:5432/auth_clean
        run: python -m pytest -q tests/test_auth_security.py -rs

  auth-e2e:
    name: Auth E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/jubileu-web/package-lock.json
      - name: Start canonical NGINX runtime
        run: |
          cp .env.dev.example .env.dev
          docker compose --env-file .env.dev -f compose.dev.yml up -d --build
          for attempt in {1..60}; do curl -fsS http://127.0.0.1:8080/api/health && exit 0; sleep 2; done
          docker compose --env-file .env.dev -f compose.dev.yml logs
          exit 1
      - name: Install browser
        working-directory: frontend/jubileu-web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Cookie auth through NGINX
        working-directory: frontend/jubileu-web
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_REUSE_EXISTING_SERVER: "1"
        run: npx playwright test e2e/auth-cookie.spec.ts --project=chromium --workers=1
      - name: Runtime logs on failure
        if: failure()
        run: docker compose --env-file .env.dev -f compose.dev.yml logs --tail=200
