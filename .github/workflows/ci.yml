name: CI

on:
  pull_request:
    branches:
      - jubileu-v2
  push:
    branches:
      - jubileu-v2

jobs:
  docs-sync:
    name: Docs sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check generated code map
        run: python scripts/docs/generate_code_map.py --check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/jubileu-api-fastapi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/jubileu-api-fastapi/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests with coverage
        run: python -m coverage run --branch -m pytest -q -rs

      - name: Report backend coverage
        run: python -m coverage report -m

      - name: Run backend smoke tests
        run: python -m pytest -q -m smoke -rs

      - name: Run backend contract tests
        run: python -m pytest -q -m contract -rs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/jubileu-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/jubileu-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Check frontend API contract
        run: npm run check:api-contract

  playwright-preflight:
    name: Playwright preflight
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend/jubileu-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/jubileu-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Show Playwright version
        run: npx playwright --version
