map $http_x_request_id $jubileu_request_id {
    "~^[0-9a-fA-F]{32}$" $http_x_request_id;
    "~^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" $http_x_request_id;
    default $request_id;
}

# Request-level NGINX errors include client IP and the raw request line. Keep
# only critical process/configuration failures; sanitized access logs retain
# status/upstream status, duration and request ID for 5xx diagnosis.
error_log /dev/stderr crit;

map $http_traceparent $jubileu_traceparent {
    "~^00-(?!0{32}-)[0-9a-f]{32}-(?!0{16}-)[0-9a-f]{16}-[0-9a-f]{2}$" $http_traceparent;
    default "";
}

map $http_cf_ray $jubileu_cf_ray {
    "~^[0-9a-fA-F]{16}-[A-Za-z]{3}$" $http_cf_ray;
    default "";
}

map "$uri:$status" $jubileu_access_log {
    default 1;
    "~^/(?:health|api/health|api/ready|nginx-health):[23][0-9]{2}$" 0;
}

# Access logs must never persist arbitrary path segments. Exact public routes
# may keep their literal path; known dynamic routes are reduced to templates;
# everything else is fail-closed as <unmatched>.
map $uri $jubileu_log_route {
    default "<unmatched>";
    "~^/$" "/";
    "~^/(?:health|nginx-health|docs|docs/oauth2-redirect|openapi\.json|redoc)$" $uri;
    "~^/assets/[^/]+$" "/assets/{asset}";
    "~^/api/(?:health|ready|version|dias|jogadores|turmas|usuarios/me|usuarios/me/jogador)$" $uri;
    "~^/api/auth/(?:login|logout|me|refresh)$" $uri;
    "~^/api/dashboards/(?:estatisticas/visao-geral|jogadores/(?:ranking|resumo)|partidas/(?:lista|resumo|serie-por-dia))$" $uri;
    "~^/api/dias/[^/]+$" "/api/dias/{data_iso}";
    "~^/api/dias/[^/]+/eventos$" "/api/dias/{data_iso}/eventos";
    "~^/api/dias/[^/]+/eventos/[^/]+$" "/api/dias/{data_iso}/eventos/{evento_id}";
    "~^/api/dias/[^/]+/eventos/[^/]+/(?:confirmar-presencas|estado|estado-equipes|partidas|times|workspace)$" "/api/dias/{data_iso}/eventos/{evento_id}/{operation}";
    "~^/api/dias/[^/]+/eventos/[^/]+/jogadores/[^/]+/(?:status|time)$" "/api/dias/{data_iso}/eventos/{evento_id}/jogadores/{jogador_evento_id}/{operation}";
    "~^/api/dias/[^/]+/eventos/[^/]+/partidas/[^/]+$" "/api/dias/{data_iso}/eventos/{evento_id}/partidas/{partida_id}";
    "~^/api/dias/[^/]+/eventos/[^/]+/partidas/[^/]+/(?:end|start)$" "/api/dias/{data_iso}/eventos/{evento_id}/partidas/{partida_id}/{operation}";
    "~^/api/dias/[^/]+/eventos/[^/]+/partidas/[^/]+/jogadores/[^/]+/stats$" "/api/dias/{data_iso}/eventos/{evento_id}/partidas/{partida_id}/jogadores/{jogador_evento_id}/stats";
    "~^/api/dias/[^/]+/eventos/[^/]+/times/[^/]+$" "/api/dias/{data_iso}/eventos/{evento_id}/times/{time_id}";
    "~^/api/eventos/[^/]+/(?:cancel|checkin|end|lances|participants|presentes|rsvp|start)$" "/api/eventos/{evento_id}/{operation}";
    "~^/api/eventos/[^/]+/participants/[^/]+/checkin$" "/api/eventos/{evento_id}/participants/{jogador_id}/checkin";
    "~^/api/eventos/[^/]+/partidas/(?:proxima|seed)$" "/api/eventos/{evento_id}/partidas/{operation}";
    "~^/api/eventos/[^/]+/rotacao/(?:confirmar-sorteio|estado|preview-sorteio)$" "/api/eventos/{evento_id}/rotacao/{operation}";
    "~^/api/jogadores/[^/]+$" "/api/jogadores/{jogador_id}";
    "~^/api/partidas/[^/]+/lances$" "/api/partidas/{partida_id}/lances";
    "~^/api/turmas/[^/]+$" "/api/turmas/{turma_id}";
    "~^/api/turmas/[^/]+/jogadores$" "/api/turmas/{turma_id}/jogadores";
    "~^/api/turmas/[^/]+/jogadores/[^/]+$" "/api/turmas/{turma_id}/jogadores/{jogador_id}";
}

log_format jubileu_json escape=json
    '{"timestamp":"$time_iso8601",'
    '"event":"nginx_access",'
    '"method":"$request_method",'
    '"route":"$jubileu_log_route",'
    '"status":$status,'
    '"upstream_status":"$upstream_status",'
    '"duration_seconds":$request_time,'
    '"upstream_duration_seconds":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,'
    '"request_id":"$jubileu_request_id",'
    '"cf_ray":"$jubileu_cf_ray",'
    '"service_version":"development",'
    '"deployment_environment":"development"}';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout jubileu_json if=$jubileu_access_log;
    add_header X-Request-ID $jubileu_request_id always;

    # Container-local NGINX liveness. It never reaches FastAPI/PostgreSQL.
    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $jubileu_request_id;
        proxy_set_header traceparent $jubileu_traceparent;
        proxy_set_header tracestate "";
        proxy_hide_header X-Request-ID;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_redirect http://$host/ https://$host/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $jubileu_request_id;
        proxy_set_header traceparent $jubileu_traceparent;
        proxy_set_header tracestate "";
        proxy_hide_header X-Request-ID;
    }

    location / {
        proxy_pass http://frontend-dev:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
