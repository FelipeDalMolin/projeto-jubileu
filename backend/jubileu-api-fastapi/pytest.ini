[pytest]
markers =
    postgresql: requires a real PostgreSQL DATABASE_URL_TEST
    uc01: autenticar usuario e consultar perfil
    uc02: manter jogadores
    uc03: manter turmas e vinculos
    uc04: consultar e criar dias
    uc05: criar e agendar evento/aula
    uc06: registrar presencas, RSVP e check-in
    uc07: formar equipes e rotacao
    uc08: criar e operar partidas
    uc09: registrar lances e estatisticas
    uc10: consultar dashboards, indicadores e workspace agregado
    smoke: smoke tests de saude/startup
    contract: contratos de rota/API/proxy
    integration: depende de banco externo ou DATABASE_URL_TEST
    e2e: testes ponta a ponta via navegador
