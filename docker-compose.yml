version: "3.8"

services:
  db:
    image: postgres:16
    container_name: jubileu_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jubileu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    container_name: jubileu-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT TCP (backend usa)
      - "8083:8083"   # MQTT over WebSocket (frontend usa)
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/data:/mosquitto/data
      - ./infra/mosquitto/log:/mosquitto/log

volumes:
  postgres_data:
